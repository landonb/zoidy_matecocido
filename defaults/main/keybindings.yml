---

# SAVVY/2024-11-30 16:30: Inspect actual bindings:
#
#   dconf dump /org/mate/desktop/keybindings/

# ALERT: The window toggle accelerators depend on DepoXy scripts:
#
#   https://github.com/DepoXy/depoxy#🍯
#
#     https://github.com/DepoXy/depoxy/blob/release/bin/windows/marco-toggle-slack
#     https://github.com/DepoXy/depoxy/blob/release/bin/windows/marco-toggle-spotify
#     https://github.com/DepoXy/depoxy/blob/release/bin/windows/toggle-visibility
#
# and are expected to be found locally under:
#
#   ~/.depoxy/ambers/bin

# CXREF: DepoXy users: See similar macOS bindings:
#
#   ~/.kit/mOS/macOS-Hammyspoony/.hammerspoon/init.lua
#   ~/.kit/mOS/macOS-onboarder/bin/slather-defaults.sh

# USAGE: Set zoidy_matecocido_keybindings_bonus in your playbook's group_vars/.
zoidy_matecocido_keybindings_bonus: []

# ***

# **** User-customizeable vars. used below.

# USAGE: Target Neovim instance w/ matching socket name (or Vim w/ --servername).
# - USYNC: See DepoXy's default ${NVIM_OPEN_SOCKETNAME:-🧸}
zoidy_matecocido_gvim_servername: '🧸'

# USAGE: Set your personal email addy in your playbook's group_vars/.
zoidy_matecocido_personal_email: 'user@gmail.com'

zoidy_matecocido_tab_match_email: ''
zoidy_matecocido_tab_url_email: 'https://mail.google.com/mail/u/0/#inbox'

zoidy_matecocido_tab_match_chats: ''
zoidy_matecocido_tab_url_chats: 'https://www.messenger.com/'

# ***

# USAGE: Set zoidy_matecocido_keybindings_gvims in your playbook's group_vars/.
zoidy_matecocido_keybindings_gvims: []

# CXREF:
#     zoidy_matecocido_keybindings_basic (this file)
#   + zoidy_matecocido_keybindings_bonus
#   + zoidy_matecocido_keybindings_gvims
#   = zoidy_matecocido_keybindings (for processing in:)
#     ~/.kit/ansible/roles/zoidy_matecocido/tasks/keybinding-circus.yml
#
zoidy_matecocido_keybindings_basic:

  # *** Keybindings defined below (where BTF: Bring-to-front):
  #
  #   <Shift-Ctrl-Cmd-A>  Open/BTF/Minimize browser tab: Gmail Inbox
  #
  #   <Cmd-T>             New Chrome Browser window
  #
  #   <Cmd-Y>             New Chromium Browser window
  #
  #   <Shift-Alt-F>       Open File Manager (caja, nautilus)
  #
  #   <Cmd-G>             Float Topmost Window [~center on a 1920x1080]
  #
  #   <Cmd-M>             Minimize (Iconify) Topmost Window
  #
  #   <Ctrl-Cmd-Q>        Lock Desktop
  #
  #   <Cmd-`>             Bring gVim to front (with servername
  #                       matching zoidy_matecocido_gvim_servername)
  #
  #   <Shift-Ctrl-Cmd-P>  Open/BTF/Minimize browser tab: PowerThesaurus
  #
  #   <Shift-Ctrl-Alt-P>  Open/BTF/Minimize browser tab: Regex Dictionary
  #
  #   <Shift-Ctrl-Cmd-X>  Open/BTF/Minimize app: Spotify
  #
  #   <Shift-Ctrl-Cmd-S>  Open/BTF/Minimize browser tab: Messenger
  #
  #   <Shift-Ctrl-Cmd-F>  Open/BTF/Minimize app: Slack
  #
  #   <Cmd-minus>         Copy *now* date ("YYYY-MM-DD") to clipboard
  #
  #   <Ctrl-Cmd-apostrophe> Copy "YYYY-MM-DD-TT-tt" to clipboard
  #
  #   <Ctrl-Cmd-semicolon>  Copy "YYYY-MM-DD TT:tt" to clipboard
  #
  #   <Cmd-Alt-P>         Generate and copy 23-character password to clipboard
  #                         `pwgen23` → clipboard
  #
  #   <Cmd-1> .. <Cmd-0>  BTF/Minimize terminal window titled "1." .. "9."
  #
  #   <Cmd-0>             Open new mate-terminal window
  #
  #   <Shift-Cmd-M>       Run tmux in mate-terminal window
  #
  #   <Cmd-D>             BTF/Minimize Dob window

  # *** Focus Email window/tab

  - name: "'[Personal] Gmail'"
    # BNDNG: <Shift-Ctrl-Cmd-A>
    binding: "'<Shift><Primary><Mod4>a'"
    action: >-
      'sh -c
      \\\"{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility
      \\'{{ zoidy_matecocido_personal_email }}\\'
      \\'Google Calendar - \\'
      {{ zoidy_matecocido_tab_match_email }}
      || sensible-browser
      --new-window \\'{{ zoidy_matecocido_tab_url_email }}\\'
      --profile-directory=Default\\\"'

  # *** New Chrome window

  # 2022-01-05: --profile-directory added to start with default user,
  #             and not the last-used profile. Which can be annoying.
  #
  # SAVVY/2025-09-11: Debian 12's /usr/bin/google-chrome targets wrapper:
  #   /opt/google/chrome/google-chrome
  # which sets a few environs and will "Sanitize std{in,out,err}" before
  # calling:
  #   /opt/google/chrome/chrome
  #
  # BNDNG: <Cmd-T>
  - name: "'Chrome Browser'"
    binding: "'<Mod4>t'"
    action: "'/usr/bin/google-chrome --profile-directory=Default'"

  # *** New Chromium window

  # BNDNG: <Cmd-Y>
  - name: "'Chromium Browser'"
    binding: "'<Mod4>y'"
    # 2023-04-22: Name simplified in Linux Mint 21.1, vs. 19.3's:
    #  action: "'/usr/bin/chromium-browser'"
    action: "'/usr/bin/chromium'"

  # *** New file browser window (caja, nautilus)

  # BNDNG: <Shift-Alt-F>
  - name: "'File Manager'"
    binding: "'<Shift><Alt>f'"
    action: "'nautilus {{ ansible_env.HOME }}/Downloads'"
    env: "GNOME"
  #
  # BNDNG: <Shift-Alt-F>
  - name: "'File Manager'"
    binding: "'<Shift><Alt>f'"
    action: "'caja {{ ansible_env.HOME }}/Downloads'"
    env: "MATE"

  # *** Open Settings

  # BNDNG: <Shift-Ctrl-Cmd-Comma> (<Shift-Ctrl-Cmd-,>)
  - name: "'GNOME Settings (Control Center)'"
    # SAVVY: MATE uses <Mod4> and <Primary>, which ZP converts
    # to <Super> and <Control>, respectively, when run on GNOME.
    # - See loop on zym_keybindings_de_specific:
    #   ~/.kit/ansible/roles/zoidy_matecocido/tasks/keybinding-circus.yml
    binding: "'<Shift><Control><Alt>comma'"
    # Calling `gnome-control-center` when it's already running doesn't
    # raise it (but does show popup saying "“Settings” is ready".
    #   action: "'gnome-control-center'"
    # - SAVVY: `ps` might report command as `gnome-control-center"
    #   or `/usr/bin/gnome-control-center`
    #   or `/usr/bin/gnome-control-center notifications`
    #   - ORGLY: ps aux | grep -v grep | grep -q -e \\'gnome-control-center\\'
    #     - But `-o command=` gives us more confidence.
    #    - We'll look for "^gnome-control-center\b" or ".*/gnome-control-center\b".
    # - REMEM/2025-09-11: IIRC, raw "action" cannot pipe, so callout "sh -c".
    action: >-
      'sh -c
      \\\"ps -ax -o command= | grep -v grep | grep -e \\'\\\\(^\\\\|\\/\\\\)gnome-control-center\\\\b\\'
      && {{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility \\'Settings\\'
      || gnome-control-center\\\"'
    env: "GNOME"

  # *** Float topmost window

  # If fullscreen, floats the topmost window using a specific geometry.
  - name: "'Float Topmost Window'"
    # BNDNG: <Cmd-G> [MATE]
    binding: "'<Mod4>g'"
    action: "'wmctrl -r :ACTIVE: -e 0,395,115,1050,750'"
    env: "MATE"

  # SAVVY: Familiar macOS binding
  #
  # - SAVVY: GNOME Shell includes <Cmd-H> by default, which Hides,
  #   which is effectively the same as Minimize (GNOME Shell doesn't
  #   implement a Hidden state different from Minimize like macOS does).
  #   - Just saying, <Cmd-M> and <Cmd-H> are equivalent on GNOME Shell.
  # BNDNG: <Cmd-M>
  - name: "'Minimize (aka Hide, Iconify) Topmost Window'"
    binding: "'<Mod4>m'"
    action: "'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/minimize-focused'"
    env: "GNOME"
  #
  # BNDNG: <Cmd-M>
  - name: "'Minimize (aka Hide, Iconify) Topmost Window'"
    binding: "'<Mod4>m'"
    action: "'sh -c \\\"xdotool windowminimize \\$(xdotool getactivewindow)\\\"'"
    env: "MATE"

  # SAVVY: Familiar macOS binding
  # BNDNG: <Ctrl-Cmd-Q>
  # - CXREF: In GNOME Shell, the lock screen keybinding as at
  #     /org/gnome/settings-daemon/plugins/media-keys/screensaver
  #   ~/.kit/mOS/macOS-onboarder/bin/slather-gsettings.sh @ 899
  - name: "'Lock Desktop'"
    binding: "'<Primary><Mod4>q'"
    action: "'sh -c \\\"mate-screensaver-command --lock\\\"'"
    env: "MATE"

  # *** Invert Screen Colors (ew!)

  # ISOFF/2023-04-22: No longer works:
  #   $ ~/.local/bin/xrandr-invert-colors
  #   `RANDR Query Version' returned error -1
  #   error while init
  # - But don't care.
  #
  #  - name: "'Invert Screen Colors'"
  #    # BNDNG: <Cmd-I> [MATE] [ISOFF]
  #    binding: "'<Mod4>i'"
  #    action: "'/bin/bash -c \\\"{{ ansible_env.HOME }}/.local/bin/xrandr-invert-colors\\\"'"

  # *** Focum gVim window

  # Bring gVim/Neovide/(n)vim to the foreground.
  # - Looks for window titles matching socket name or
  #   --servername, a convention used by DepoXy (e.g.,
  #   `fs` alias), `gvim-open-kindness`/`nvim-open-kindness`
  #   (GVIM_OPEN_SERVERNAME/NVIM_OPEN_SOCKETNAME), and more.
  # BNDNG: <Cmd-`> (<Cmd-backtick>)
  - name: "'Raise EDITOR named {{ zoidy_matecocido_gvim_servername }}'"
    # BNDNG: <Cmd-Backtick> (<Cmd-`>)
    binding: "'<Mod4>grave'"
    action: >-
      '{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility
      \\\"{{ zoidy_matecocido_gvim_servername }}\\\"'
    env: "GNOME"
  #
  - name: "'Raise EDITOR named {{ zoidy_matecocido_gvim_servername }}'"
    # BNDNG: <Cmd-Backtick> (<Cmd-`>)
    binding: "'<Mod4>grave'"
    action: "'xdotool search --name {{ zoidy_matecocido_gvim_servername }} windowactivate'"
    env: "MATE"

  # [lb]: Use --new-window for the obvious reason of not changing any
  # existing browser windows you've got open (and, say, changing the
  # active tab, to your annoyance), but also so the browser is brought
  # to the front (so you don't have to alt-tab or otherwise find it
  # yourself, which happens if we call `sensible-browser` without the
  # option).

  # *** Focus or Open PowerThesaurus browser tab

  # BNDNG: <Shift-Ctrl-Cmd-P>
  - name: "'PowerThesaurus [tab]'"
    binding: "'<Shift><Primary><Mod4>p'"
    action: >-
      'sh -c
      \\\"{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility
      \\'Power Thesaurus - \\'
      || sensible-browser
      --new-window \\'https://www.powerthesaurus.org/\\'
      --profile-directory=Default\\\"'

  # *** Focus or Open RegexDictionary browser tab

  # BNDNG: <Shift-Ctrl-Alt-*> (<Shift-Ctrl-Alt-8>)
  - name: "'Regex Dictionary [tab]'"
    # These don't work:
    #   binding: "'<Shift><Primary><Mod4>8'"
    #   binding: "'<Shift><Primary><Mod4>asterisk'"
    binding: "'<Shift><Primary><Mod4>8'"
    action: >-
      'sh -c
      \\\"{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility
      \\'Regex Dictionary by Lou Hevly - \\'
      || sensible-browser
      --new-window \\'https://www.visca.com/regexdict/\\'
      --profile-directory=Default\\\"'

  # *** Focus Spotify application window

  # Brings the Spotify application window to the front.
  # - CXREF/2025-09-11: At least for Spotify installed
  #     via `apt install spotify-client` (e.g., Debian 12):
  #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-desktop-spotify.yml
  - name: "'Kick Out The Jams [Spotify]'"
    # BNDNG: <Shift-Ctrl-Cmd-X>
    binding: "'<Shift><Primary><Mod4>x'"
    action: >-
      'sh -c
      \\\"ps aux | grep -v grep | grep -q -e \\' /usr/share/spotify/spotify \\'
      && {{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility \\'Spotify\\'
      || /usr/bin/spotify\\\"'
    env: "GNOME"
    #
  - name: "'Kick Out The Jams [Spotify]'"
    # BNDNG: <Shift-Ctrl-Cmd-X>
    binding: "'<Shift><Primary><Mod4>x'"
    # Argh: (lb): I give up, deferring to script, trying to delimit quotes
    # and dollar signs in dconf entries is frustrating, just shell out!
    action: "'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/marco-toggle-spotify'"
    env: "MATE"

  # *** Focus Facebook Messenger browser tab

  # Brings "Chats" window to the front.
  # - UCASE: Author maintains long-running Chrome window with
  #   one tab each for Android SMS (Google Messages), Facebook
  #   Messenger, and Instagram Chats.
  # - USAGE: The default chat URL defaults to Facebook:
  #     zoidy_matecocido_tab_url_chats: 'https://www.messenger.com/'
  #   If you customize that value, be sure to set the window title
  #   match value.
  #   - E.g., the author opens a local HTML file with href links to
  #     all my chat URLs (i.e., SMS, FB, Insta). Then I can just
  #     Ctrl-Click each link to open all the chats tabs.
  #     - Accordingly, I've customized the two vars. thusly:
  #       zoidy_matecocido_tab_url_chats: 'file:///path/to/Chat-Tabs.html'
  #       zoidy_matecocido_tab_match_chats: "\\'🗨️         Chat & Social\\'"
  - name: "'[Facebook] Messenger'"
    # BNDNG: <Shift-Ctrl-Cmd-S>
    binding: "'<Shift><Primary><Mod4>s'"
    action: >-
      'sh -c
      \\\"{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-visibility
      \\'Google Messages for web\\'
      \\'Messenger\\'
      \\'Inbox • Chats\\'
      {{ zoidy_matecocido_tab_match_chats }}
      || sensible-browser
      --new-window \\'{{ zoidy_matecocido_tab_url_chats }}\\'
      --profile-directory=Default\\\"'
    # HSTRY/2025-09-11: Previously, if the Chrome window was showing the first
    # tab (which shows the author's HTML links file), the accelerator would
    # call xdotool to change tabs, e.g.:
    #   || (
    #   wmctrl -a \\'Chat & Social - \\'
    #   && sleep 0.13
    #   && xdotool key \\'ctrl+Tab\\'
    #   )
    # but GNOME doesn't support sending GUI input (at least not easily).
    #
    # - HSTRY: The remainder of this comment is old notes on the matter.
    #
    # (lb): If you always had a Messenger tab active in some window somewhere,
    # this would be a simple action:
    #
    #   action: "'wmctrl -a \\\"Messenger - \\\"'"
    #
    # However, Facebook "blinks" the window title on new message, which can
    # be very distracting if you're not checking messages immediately when
    # they're received. (Moreover, I think it's rather rude and intrusive.
    # I realize the behavior ensures that you know you have unread messages,
    # but why couldn't it be more like Gmail and just indicate the number of
    # new messages in parentheses in the window title?)
    #
    # Because of this, and so that I can leave my Messenger window open and
    # in its spot in the mate-panel window list, I like to check messages,
    # but then I'll park the browser window on a static tab. The static tab
    # is simply a blank page I've got saved on my filesystem, which is titled,
    # 'Chat & Social' (a hint to what tabs I have loaded in that browser window,
    # which is especially useful because mate-panels has been crashing of late,
    # and I sometimes find myself manually dragging windows icons back to their
    # proper window list positions, so having labeled windows helps).
    #
    # In short, I can check messages at my leisure, and I'm not annoyed by a
    # blinking window title as soon as I receive a new message. But now there's
    # extra work to bring Messenger to the front -- we might have to bring the
    # static page to the front and then switch tabs.
    #
    # 2020-01-04: There's a timing issue running this from a keybinding!
    # This snippet works fine from the command line,
    #   but not as a MATE keybinding.
    # If we call the implicit send-key command immediately:
    #     xdotool key 'ctrl+Tab'
    #   the key send has no effect.
    # If we get the window ID and try using that, still nothing:
    #     local window_id=$(xdotool search --name 'Chat & Social' | head -n 1)
    #     # local winid_hex=$(printf "0x%x" ${window_id})
    #     # Ensure exists:
    #     #   xwininfo -id $WINID_HEX | grep 'Chat & Social'
    #     xdotool key --window ${window_id} 'ctrl+Tab'
    #     # Chat & Social tab focused, but ctrl+Tab not received!
    # Fortunately, like all things uncontrollable, just wait for
    #   things to simmer down, then attack.
    # Note that I tried `sleep 0.05` but that didn't work.
    #   Using 0.1 seems to always work (so far, at least).
    #   Or maybe 0.13, I think I had one 0.1 slip through.

  #           ↓   ↓
  # *** Focus Slack
  #           ↑   ↑

  # BNDNG: <Shift-Ctrl-Cmd-F>
  - name: "'Slack'"
    binding: "'<Shift><Primary><Mod4>f'"
    action: >-
      'sh -c
      \\\"wmctrl -a \\'| Slack\\'
      || \\'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/marco-toggle-slack\\'\\\"'

  # *** Date.now()/datetime.now()

  # Copies "YYYY-MM-DD" date into clipboard.
  - name: "'Now(TTT)'"
    # FRMAT: +%Y-%m-%d
    # BNDNG: <Cmd-Minus> (<Cmd-->)
    binding: "'<Mod4>minus'"
    action: "'sh -c \\\"date \\'+%Y-%m-%d\\' | tr -d \\'\\n\\' | xclip\\\"'"

  # Copies "YYYY-MM-DD TT:tt" datetime into clipboard.
  - name: "'Now(TTTtt:)'"
    # BNDNG: <Ctrl-Cmd-Semicolon> (<Ctrl-Cmd-;>)
    binding: "'<Primary><Mod4>semicolon'"
    action: "'sh -c \\\"date \\'+%Y-%m-%d %H:%M\\' | tr -d \\'\\n\\' | xclip\\\"'"

  # Copies "YYYY-MM-DD-TT-tt" datetime into clipboard.
  # - Aka: Dashed date-plus-time.
  - name: "'Now(TTTtt-)'"
    # FRMAT: +%Y-%m-%d-%H-%M
    # BNDNG: <Ctrl-Cmd-Quote> (<Ctrl-Cmd-SingleQuote>, <Ctrl-Cmd-Apostrophe>, <Ctrl-Cmd-'>)
    binding: "'<Primary><Mod4>apostrophe'"
    action: "'sh -c \\\"date \\'+%Y-%m-%d-%H-%M\\' | tr -d \\'\\n\\' | xclip\\\"'"
    # MAYBE: Restrict to MATE. (See GNOME TTTtt- binding below.)
    #  env: "MATE"
  # REFER: Not all bindings that work in GNOME also work in MATE (at least
  # in author's experience). / So avoid at least these bindings in MATE:
  # - Didn't work in MATE: <Shift><Mod4>underscore / <Shift><Mod4>minus
  #   Works fine in GNOME: <Shift><Super>minus
  # - Didn't work in MATE: <Shift><Primary><Mod4>semicolon / <Shift><Primary><Mod4>colon
  #   Works fine in GNOME: <Shift><Control><Super>semicolon
  # - Although this worked in MATE: <Shift-Ctrl-Super-minus> (and was separate
  #   from <Ctrl-Super-minus>).
  #
  - name: "'Now(TTTtt:)'"
    # BNDNG: <Ctrl-Cmd-Minus> (<Ctrl-Cmd-->) [vim: <C-D-->]
    #        - The "normal" date-plus-time format, e.g., "2022-02-28 22:02",
    #          is good for adding date and time to notes, emails, etc.
    binding: "'<Control><Super>minus'"
    action: "'sh -c \\\"date \\'+%Y-%m-%d %H:%M\\' | tr -d \\'\\n\\' | xclip\\\"'"
  #
  - name: "'Now(TTTtt-)'"
    # FRMAT: +%Y-%m-%d-%H-%M
    # - UCASE: The all-dashed date-plus-time, e.g., "2022-02-28-22-02", is
    #          good for using in filenames (when you care to avoid spaces).
    # BNDNG: <Shift-Cmd-Minus> (<Shift-Cmd-Underscore>, <Shift-Cmd-->, <Shift-Cmd-_>)
    binding: "'<Shift><Super>minus'"
    action: "'sh -c \\\"date \\'+%Y-%m-%d-%H-%M\\' | tr -d \\'\\n\\' | xclip\\\"'"
    # See comment above re: MATE <Shift-Cmd> bindings.
    env: "GNOME"

  # *** pwgen23 to clippy

  # Using printf to avoid the newline.
  - name: "'pwgen|clip'"
    # BNDNG: <Cmd-Alt-P>
    binding: "'<Mod4><Alt>p'"
    # CXREF: We use a Home-fries func. for better maintainability:
    #   https://github.com/landonb/home-fries#🍟
    #     ~/.kit/sh/home-fries/lib/alias/alias_pwgen.sh
    #   - Albeit requiring the user to also have home-fries
    #     installed. But we're all DepoXy users here, aren't
    #     we?
    # - ALTLY: Here's how you might specify this directly:
    #     action: >-
    #       'sh -c
    #       \\\"printf \\'%s\\'
    #       \\$(pwgen 2 1 | tr -d \\'\\\\'\\'\\n\\'\\\\'\\' ;
    #       pwgen -n 21 -s -N 1 -y | tr -d \\'\\\\'\\'\\n\\'\\\\'\\' ;
    #       pwgen 2 1) | xclip\\\"'
    # NTRST: Watch your escapes — this 'action' value is processed by
    # ansible.builtin.shell, which calls `dconf write` (we're not using
    # a dconf Anisble module, but rather just shelling out).
    # - So this value is subject to shell expansion (as are 'name' and 'binding').
    # - I've noted this because the HOMEFRIES_LIB usage here is just for
    #   readability/findabililty/consistency. Because expansion (and because
    #   Ansible runs over SSH w/ very few environs set), HOMEFRIES_LIB will
    #   always be unset during the play.
    action: >-
      'sh -c
      \\\". ${HOMEFRIES_LIB:-{{ ansible_env.HOME }}/.homefries/lib}/alias/alias_pwgen.sh
      && printf \\'%s\\' \\\"\\\$(_hf_aliases_wire_pwgen_pwgen23)\\\"
      | xclip\\\"'
    # ALTLY: Here's an approach with 68% less escaping (6 \'s vs. 19).
    #   action: >-
    #     'bash -c \\\"
    #     . ${HOMEFRIES_LIB:-{{ ansible_env.HOME }}/.homefries/lib}/alias/alias_pwgen.sh
    #     && . ${HOMEFRIES_LIB:-{{ ansible_env.HOME }}/.homefries/lib}/alias/alias_clip.sh
    #     && _hf_aliases_wire_pwgen_pwgen23 | _hf_clip\\\"'

  # ***

  # Front window with number prefix, e.g., "1. <title>", "2. <title>", etc.
  #
  # - Author uses to quickly access terminal windows.
  #
  #   Home-fries finds a unique window number from 1-9 for each terminal
  #   window opened and prefixes it to the PS1 titlebar title.
  #
  #   - CXREF:
  #
  #     ~/.kit/sh/sh-humble-prompt/lib/show-command-name-in-window-title.sh

  # BNDNG: <Cmd-1>
  - name: "'Window 1. to front'"
    binding: "'<Mod4>1'"
    action: "'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-numbered \\'1\\''"

  # BNDNG: <Cmd-2>
  - name: "'Window 2. to front'"
    binding: "'<Mod4>2'"
    action: "'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-numbered \\'2\\''"

  # BNDNG: <Cmd-3>
  - name: "'Window 3. to front'"
    binding: "'<Mod4>3'"
    action: "'{{ ansible_env.HOME }}/.depoxy/ambers/bin/windows/toggle-numbered \\'3\\''"

  # BNDNG: <Cmd-4>
  - name: "'Window 4. to front'"
    binding: "'<Mod4>4'"
